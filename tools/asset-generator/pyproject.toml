[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fourcorners-asset-generator"
version = "0.1.0"
description = "Generate Minecraft-ready textures and sounds for The Four Corners mod"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "elevenlabs>=1.0.0",
    "Pillow>=10.0.0",
    "pydub>=0.25.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
asset-gen = "asset_generator.cli:app"

[tool.setuptools.packages.find]
where = ["."]
