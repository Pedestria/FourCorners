# Four Corners Asset Manifest
# This is the single source of truth for all mod assets.
# Each entry maps a content ID to generation parameters.
#
# Fields:
#   id:         Unique content ID (matches Minecraft registry name)
#   type:       block_texture | item_texture | gui_texture | sound_effect
#   prompt:     Generation prompt (appended to the base aesthetic prompt)
#   element:    earth | water | air | fire | null (for elemental palette)
#   width:      Pixel width (default 16)
#   height:     Pixel height (default 16)
#   tileable:   Whether the texture must tile seamlessly (default true for blocks)
#   tags:       Freeform tags for filtering
#   output_path: Override default output path (usually auto-derived)

assets:

